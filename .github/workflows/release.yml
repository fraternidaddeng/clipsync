name: Release

# Tag v* -> package the Windows portable ZIP and the Android APK (both with
# .sha256 sidecars, produced by the stage-7 scripts) and attach everything to a
# GitHub Release. Publishing here is packaging only: it does not claim device
# QA (see docs/verification-without-device.md and docs/manual-qa-results.md).
on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package-windows:
    name: Package Windows portable ZIP
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish self-contained ZIP + SHA-256
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          ./scripts/package-windows.ps1 -Version $version

      - uses: actions/upload-artifact@v7
        with:
          name: windows-package
          path: dist/*
          if-no-files-found: error

  package-android:
    name: Package Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      # Signing material comes exclusively from repository secrets; the
      # keystore never enters the repository (scripts/package-android.ps1).
      # Without the secrets the job still succeeds but honestly produces
      # ClipSync-android-unsigned.apk, which cannot be installed.
      #
      # versionName/versionCode come from the tag (leading "v" stripped), so
      # the APK can never ship the stale defaults hardcoded in
      # android/app/build.gradle.kts. package-android.ps1 documents the
      # versionCode scheme (rc tags sort below their final release) and fails
      # the job if the tag is not vX.Y.Z or vX.Y.Z-rc.N.
      - name: Assemble release APK + SHA-256
        shell: pwsh
        env:
          CLIPSYNC_ANDROID_KEYSTORE_BASE64: ${{ secrets.CLIPSYNC_ANDROID_KEYSTORE_BASE64 }}
          CLIPSYNC_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.CLIPSYNC_ANDROID_KEYSTORE_PASSWORD }}
          CLIPSYNC_ANDROID_KEY_ALIAS: ${{ secrets.CLIPSYNC_ANDROID_KEY_ALIAS }}
          CLIPSYNC_ANDROID_KEY_PASSWORD: ${{ secrets.CLIPSYNC_ANDROID_KEY_PASSWORD }}
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($env:CLIPSYNC_ANDROID_KEYSTORE_BASE64) {
            $keystore = Join-Path $env:RUNNER_TEMP 'clipsync-release.jks'
            [IO.File]::WriteAllBytes($keystore, [Convert]::FromBase64String($env:CLIPSYNC_ANDROID_KEYSTORE_BASE64))
            $env:CLIPSYNC_ANDROID_KEYSTORE = $keystore
            ./scripts/package-android.ps1 -Version $version
          }
          else {
            Write-Warning 'CLIPSYNC_ANDROID_* secrets are not configured; producing an UNSIGNED build-verification APK.'
            ./scripts/package-android.ps1 -Version $version -AllowUnsignedRelease
          }

      - uses: actions/upload-artifact@v7
        with:
          name: android-package
          path: dist/*
          if-no-files-found: error

  publish-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - package-windows
      - package-android
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Compose release notes
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          {
            echo "自动打包产物（\`.github/workflows/release.yml\`，构建自 \`${GITHUB_SHA}\`）："
            echo
            echo '| 产物 | SHA-256 |'
            echo '|---|---|'
            for f in dist/*.sha256; do
              name="$(basename "${f%.sha256}")"
              hash="$(cut -d' ' -f1 "$f")"
              echo "| \`$name\` | \`$hash\` |"
            done
            echo
            if [ -f dist/ClipSync-android-unsigned.apk ]; then
              echo '> **Android APK 未签名，不可安装**：仓库未配置 `CLIPSYNC_ANDROID_*` secrets（keystore base64、密码、别名），本产物仅供构建校验。配置 secrets 后重新运行本工作流即得已签名 APK。'
            else
              echo '> Android APK 以 `CLIPSYNC_ANDROID_*` secrets 注入的发布密钥签名（密钥库不入库）。'
            fi
            echo
            echo '安装 / 配对 / 排障：`docs/install.md`（副本随 Windows ZIP 分发）。'
            echo
            echo '诚实边界：本发布仅代表打包与自动化测试（范围见 `docs/verification-without-device.md`）；真机验收状态以 `docs/manual-qa-results.md` 与 `docs/device-validation-matrix.md` 为准——发布 ≠ 真机验证通过。变更明细见 `CHANGELOG.md`。'
          } > release-notes.md
          cat release-notes.md

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          PRERELEASE_FLAG=""
          case "$TAG" in
            *-*) PRERELEASE_FLAG="--prerelease" ;;
          esac
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG exists; replacing assets and notes."
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md
            # A signed re-run supersedes an earlier unsigned one, but `upload
            # --clobber` only replaces same-named files: the stale
            # ClipSync-android-unsigned.apk (+ .sha256) left by a run without
            # the CLIPSYNC_ANDROID_* secrets must be deleted explicitly, or the
            # release would offer both a signed and an uninstallable APK.
            if [ ! -f dist/ClipSync-android-unsigned.apk ]; then
              for stale in ClipSync-android-unsigned.apk ClipSync-android-unsigned.apk.sha256; do
                if gh release delete-asset "$TAG" "$stale" --repo "$GITHUB_REPOSITORY" --yes > /dev/null 2>&1; then
                  echo "Deleted stale unsigned asset: $stale"
                fi
              done
            fi
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/*
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "ClipSync $TAG" \
              --notes-file release-notes.md \
              --verify-tag $PRERELEASE_FLAG \
              dist/*
          fi
