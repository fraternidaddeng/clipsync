name: CI

on:
  push:
    branches:
      - main
      - "cursor/**"
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-protocol:
    name: Protocol schemas and fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: python -m pip install jsonschema referencing cryptography

      - name: Validate protocol v1 + v2 + bt1
        shell: pwsh
        run: ./scripts/validate-protocol.ps1

  build-windows:
    name: Windows build and tests
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build and test (restore, build, dotnet test incl. App.Tests)
        shell: pwsh
        run: ./scripts/build-windows.ps1

  build-android:
    name: Android unit tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests and assembleDebug
        working-directory: android
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

  e2e-stage4:
    name: Cross-client E2E (stage-4 chain)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      # Real Kestrel + TLS pin + WebSocket listener (ClipSync.E2eHost) driven by the
      # Android JVM dialer suite (com.clipsync.android.e2e.*); prints E2E-PASS only
      # when both directions converge exactly once.
      - name: Run stage-4 E2E (scripts/run-e2e-stage4.ps1)
        shell: pwsh
        run: ./scripts/run-e2e-stage4.ps1

  static-analysis:
    name: Android static analysis (detekt + ktlint)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      # Baselines live in android/config/{detekt,ktlint}; new violations fail the job.
      - name: detekt + ktlintCheck
        working-directory: android
        run: ./gradlew detekt ktlintCheck --stacktrace

  secret-scan:
    name: Committed-secret guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # 轻量已提交密钥守门（2026-08-27 安全审计常驻化）：只扫已追踪文件的
      # 文件名形态（密钥库/私钥/.env 等）与高信号凭据形态（私钥块、GitHub/
      # AWS/Google/Slack/Stripe/OpenAI/npm/Azure 前缀）。协议 fixtures 与单测
      # 的合成向量不在命中范围；本作业红线几乎必然是真泄露，先轮换再清理。
      - name: check-secrets (tracked filenames + credential patterns)
        run: bash scripts/check-secrets.sh

  i18n-parity:
    name: i18n parity and generated resources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cross-platform string parity (keys + placeholders, 19 locales)
        run: python3 scripts/check-i18n-parity.py

      - name: Windows resx/Designer in sync with strings.json
        run: |
          python3 scripts/generate-windows-strings.py
          git diff --exit-code -- windows/ClipSync.App/Localization
