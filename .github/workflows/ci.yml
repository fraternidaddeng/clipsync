name: CI

on:
  push:
    branches:
      - main
      - "cursor/**"
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-protocol:
    name: Protocol schemas and fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: python -m pip install jsonschema referencing

      - name: Validate protocol v1 + v2
        shell: pwsh
        run: ./scripts/validate-protocol.ps1

  build-windows:
    name: Windows build and tests
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build and test (restore, build, dotnet test incl. App.Tests)
        shell: pwsh
        run: ./scripts/build-windows.ps1

  build-android:
    name: Android unit tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and assembleDebug
        working-directory: android
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace
